<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>xPts Engine — Matchday Dossier</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet"/>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0a0c14; --bg-outer: #060810; --surf: #0f1120;
  --card: #141828; --card2: #1a1f35;
  --border: rgba(255,220,170,.06);
  --border-hi: rgba(245,158,11,.3);
  --fire: #FF5722; --fire-dim: rgba(255,87,34,.15);
  --gold: #f59e0b; --gold-dim: rgba(245,158,11,.15);
  --green: #2E7D32; --green-lt: #4CAF50; --green-dim: rgba(76,175,80,.15);
  --pink: #ff2d78;
  --text: #f5ece0; --muted: #7a6a58; --sub: #a89785;
  --gk: #FFB300; --def: #4CAF50; --mid: #42A5F5; --fwd: #EF5350;
  --neon: #00f0ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg-outer);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  padding: 12px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ''; position: fixed; inset: 0; opacity: .03; pointer-events: none; z-index: 9999;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 180px;
}
a { color: inherit; text-decoration: none; }
.frame {
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 40% 25% at 15% 0%, rgba(255,87,34,.06), transparent),
    radial-gradient(ellipse 50% 30% at 80% 80%, rgba(46,125,50,.05), transparent);
  border-radius: 20px;
  border: 1px solid var(--border);
  height: calc(100vh - 24px);
  display: flex; flex-direction: column;
  overflow: hidden;
  box-shadow: 0 0 80px rgba(0,0,0,.5), 0 0 0 1px rgba(245,158,11,.05);
}

/* NAV */
.nav {
  height: 56px; padding: 0 22px;
  background: var(--surf);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 18px;
  border-radius: 20px 20px 0 0;
  position: relative;
}
.nav::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--neon) 30%, rgba(0,240,255,.8) 50%, var(--neon) 70%, transparent);
  border-radius: 20px 20px 0 0;
}
.nav-logo { display: flex; align-items: center; flex-shrink: 0; }
.nav-tabs { display: flex; gap: 4px; margin-left: 24px; }
.nav-tab {
  padding: 8px 16px; border-radius: 20px;
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  text-transform: uppercase; letter-spacing: .5px; font-size: 13px;
  color: var(--muted); background: transparent; border: 1px solid transparent; cursor: pointer;
  transition: color .15s, background .15s;
}
.nav-tab:hover { color: var(--sub); }
.nav-tab.active {
  color: #fff; background: var(--fire); border-color: var(--fire);
  box-shadow: 0 2px 16px rgba(255,87,34,.35);
}
.nav-filters { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.seg {
  display: flex; padding: 3px; border-radius: 999px;
  background: rgba(255,255,255,.04); border: 1px solid var(--border);
}
.seg button {
  padding: 5px 14px; border-radius: 999px;
  font-family: 'Oswald', sans-serif; font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .6px;
  color: var(--muted); background: transparent; border: 0; cursor: pointer;
  transition: color .15s, background .15s;
}
.seg button:hover { color: var(--sub); }
.seg button.active { color: #fff; background: var(--fire); box-shadow: 0 1px 8px rgba(255,87,34,.3); }

/* MAIN */
.main { flex: 1; display: grid; grid-template-columns: 340px 1fr; overflow: hidden; }

/* LIST */
.list-pane {
  border-right: 1px solid var(--border);
  background: var(--surf);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.list-head {
  padding: 12px 18px 10px;
  display: flex; align-items: baseline; gap: 10px;
  border-bottom: 1px solid var(--border);
}
.list-head h2 {
  font-family: 'Barlow Condensed', sans-serif; font-size: 18px;
  font-weight: 800; text-transform: uppercase; letter-spacing: .5px;
}
.list-head h2 em { font-style: normal; color: var(--fire); }
.list-head-count {
  font-family: 'Oswald'; font-size: 11px; font-weight: 500;
  color: var(--muted); text-transform: uppercase; letter-spacing: 1px;
}
.list-filters {
  padding: 8px 18px; display: flex; gap: 4px; border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.pos-chip {
  padding: 3px 10px; border-radius: 999px;
  font-family: 'Oswald'; font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .6px;
  background: transparent; border: 1px solid rgba(255,255,255,.08);
  color: var(--muted); cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
}
.pos-chip:hover { color: var(--sub); }
.pos-chip.active[data-p="ALL"] { background: rgba(255,255,255,.08); color: var(--text); border-color: rgba(255,255,255,.2); }
.pos-chip.active[data-p="GK"] { background: rgba(255,179,0,.15); border-color: rgba(255,179,0,.4); color: var(--gk); }
.pos-chip.active[data-p="DEF"] { background: rgba(76,175,80,.15); border-color: rgba(76,175,80,.4); color: var(--def); }
.pos-chip.active[data-p="MID"] { background: rgba(66,165,245,.15); border-color: rgba(66,165,245,.4); color: var(--mid); }
.pos-chip.active[data-p="FWD"] { background: rgba(239,83,80,.15); border-color: rgba(239,83,80,.4); color: var(--fwd); }
.pos-chip[data-p="GK"]  { color: rgba(255,179,0,.55);  border-color: rgba(255,179,0,.2); }
.pos-chip[data-p="DEF"] { color: rgba(76,175,80,.55);  border-color: rgba(76,175,80,.2); }
.pos-chip[data-p="MID"] { color: rgba(66,165,245,.55); border-color: rgba(66,165,245,.2); }
.pos-chip[data-p="FWD"] { color: rgba(239,83,80,.55);  border-color: rgba(239,83,80,.2); }

.list-search {
  padding: 8px 18px; border-bottom: 1px solid var(--border);
}
.list-search input {
  width: 100%; padding: 8px 12px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--border);
  color: var(--text); font-family: 'DM Sans'; font-size: 13px; outline: 0;
}
.list-search input:focus { border-color: var(--border-hi); }
.list-search input::placeholder { color: var(--muted); }

.list {
  flex: 1; overflow-y: auto; padding: 6px 0;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.08) transparent;
}
.list::-webkit-scrollbar { width: 4px; }
.list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 3px; }

.list-item {
  display: grid;
  grid-template-columns: 24px 22px 20px 1fr auto;
  gap: 9px; align-items: center;
  padding: 8px 18px;
  cursor: pointer; border-left: 2px solid transparent;
  transition: background .12s, border-color .12s;
}
.li-logo {
  width: 20px; height: 20px; object-fit: contain;
  display: block;
}
.li-fix {
  display: flex; align-items: center; gap: 4px;
}
.li-fix .fx-logo {
  width: 11px; height: 11px; object-fit: contain;
  opacity: .85;
}
.list-item:hover { background: rgba(245,158,11,.04); }
.list-item.active {
  background: linear-gradient(90deg, rgba(255,87,34,.08), transparent 70%);
  border-left-color: var(--fire);
}
.li-rank {
  font-family: 'Clash Display'; font-weight: 600; font-size: 15px;
  color: var(--muted); text-align: center;
}
.list-item.active .li-rank { color: var(--fire); }
.li-rank.top3 { color: var(--fire); }
.pos-badge {
  width: 22px; height: 22px; border-radius: 6px;
  font-family: 'Oswald'; font-weight: 700; font-size: 10px;
  display: flex; align-items: center; justify-content: center;
}
.pos-badge.gk { background: rgba(255,179,0,.15); color: var(--gk); border: 1px solid rgba(255,179,0,.3); }
.pos-badge.def { background: rgba(76,175,80,.15); color: var(--def); border: 1px solid rgba(76,175,80,.3); }
.pos-badge.mid { background: rgba(66,165,245,.15); color: var(--mid); border: 1px solid rgba(66,165,245,.3); }
.pos-badge.fwd { background: rgba(239,83,80,.15); color: var(--fwd); border: 1px solid rgba(239,83,80,.3); }
.li-body { min-width: 0; }
.li-name {
  font-family: 'Barlow Condensed'; font-weight: 700; font-size: 14px;
  text-transform: uppercase; letter-spacing: .3px; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.li-fix-txt {
  font-family: 'Oswald'; font-size: 10px; font-weight: 500;
  color: var(--muted); text-transform: uppercase; letter-spacing: .8px;
}
.li-xpts {
  font-family: 'Clash Display'; font-weight: 600; font-size: 16px;
  color: var(--text);
}

/* DOSSIER CANVAS */
.canvas {
  overflow-y: auto; padding: 0;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.08) transparent;
}
.canvas::-webkit-scrollbar { width: 4px; }
.canvas::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 3px; }

.canvas-empty {
  height: 100%; display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 10px; padding: 40px;
  color: var(--muted);
}
.canvas-empty .big {
  font-family: 'Barlow Condensed'; font-weight: 800; font-size: 28px;
  text-transform: uppercase; letter-spacing: 1px; color: var(--sub);
}
.canvas-empty .small {
  font-family: 'Oswald'; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px;
}

/* HERO */
.hero {
  padding: 28px 32px 24px;
  border-bottom: 1px solid var(--border);
  display: grid; grid-template-columns: 1fr 1.3fr;
  gap: 32px; align-items: stretch;
  background:
    radial-gradient(ellipse 60% 80% at 0% 0%, rgba(239,83,80,.08), transparent 60%),
    linear-gradient(180deg, rgba(255,87,34,.03), transparent);
  position: relative;
}
.hero::after {
  content: ''; position: absolute; inset: 0;
  background-image:
    repeating-linear-gradient(90deg, rgba(245,158,11,.02) 0 1px, transparent 1px 40px),
    repeating-linear-gradient(0deg, rgba(245,158,11,.02) 0 1px, transparent 1px 40px);
  pointer-events: none;
}
.hero-xpts {
  display: flex; flex-direction: column; justify-content: space-between;
  position: relative; z-index: 1;
}
.hero-id {
  display: flex; align-items: center; gap: 10px;
}
.hero-pos {
  width: 32px; height: 32px; border-radius: 8px;
  font-family: 'Oswald'; font-weight: 700; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
}
.hero-pos.gk { background: rgba(255,179,0,.15); color: var(--gk); border: 1px solid rgba(255,179,0,.35); }
.hero-pos.def { background: rgba(76,175,80,.15); color: var(--def); border: 1px solid rgba(76,175,80,.35); }
.hero-pos.mid { background: rgba(66,165,245,.15); color: var(--mid); border: 1px solid rgba(66,165,245,.35); }
.hero-pos.fwd { background: rgba(239,83,80,.15); color: var(--fwd); border: 1px solid rgba(239,83,80,.35); }
.hero-club {
  font-family: 'Oswald'; font-weight: 600; font-size: 12px;
  color: var(--muted); text-transform: uppercase; letter-spacing: 2px;
}
.hero-name {
  font-family: 'Barlow Condensed'; font-weight: 800;
  font-size: clamp(36px, 3.6vw, 52px);
  text-transform: uppercase; letter-spacing: -.01em;
  line-height: .95;
  margin-top: 16px;
}
.hero-sub {
  font-family: 'DM Sans'; font-size: 13px; color: var(--sub);
  margin-top: 10px; line-height: 1.5;
}
.hero-xpts-big {
  margin-top: 24px;
  display: flex; align-items: baseline; gap: 10px;
}
.hero-xpts-n {
  font-family: 'Clash Display'; font-weight: 700;
  font-size: clamp(72px, 8vw, 110px);
  line-height: .9; letter-spacing: -.03em;
  color: var(--text);
  text-shadow: 0 2px 40px rgba(255,87,34,.2);
}
.hero-xpts-lbl {
  font-family: 'Oswald'; font-weight: 600; font-size: 14px;
  text-transform: uppercase; letter-spacing: 2px; color: var(--fire);
}
.hero-raw {
  font-family: 'DM Sans'; font-size: 12px; color: var(--muted);
  margin-top: 4px;
}
.hero-raw strong { color: var(--text); font-weight: 600; }

/* Hero right: fixture scorecard */
.fixture-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px;
  display: flex; flex-direction: column; justify-content: space-between;
  position: relative; z-index: 1;
  overflow: hidden;
}
.fixture-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--green-lt), var(--gold), var(--fire));
}
.fix-meta {
  display: flex; justify-content: space-between;
  font-family: 'Oswald'; font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted);
  margin-bottom: 20px;
}
.fix-meta .stage { color: var(--fire); }
.fix-teams {
  display: grid; grid-template-columns: 1fr auto 1fr;
  align-items: center; gap: 20px;
}
.fix-team {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.fix-crest {
  width: 58px; height: 58px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed'; font-weight: 800; font-size: 18px;
  letter-spacing: 1px;
  background: rgba(255,255,255,.03);
  border: 1.5px solid rgba(255,255,255,.1);
  overflow: hidden;
}
.fix-crest img { width: 40px; height: 40px; object-fit: contain; }
.fix-crest.home { border-color: var(--green-lt); background: rgba(76,175,80,.06); }
.fix-crest.away { border-color: var(--fire); background: rgba(255,87,34,.06); }
.fix-teamname {
  font-family: 'Barlow Condensed'; font-weight: 700; font-size: 16px;
  text-transform: uppercase; letter-spacing: .5px;
  text-align: center;
}
.fix-role {
  font-family: 'Oswald'; font-size: 9px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted);
}
.fix-vs {
  font-family: 'Clash Display'; font-weight: 600; font-size: 28px;
  color: var(--muted);
}
.fix-foot {
  margin-top: 20px; padding-top: 14px;
  border-top: 1px solid var(--border);
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
}
.fix-stat {
  display: flex; flex-direction: column; gap: 2px;
  text-align: center;
}
.fix-stat-lbl {
  font-family: 'Oswald'; font-weight: 500; font-size: 9px;
  text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
}
.fix-stat-val {
  font-family: 'Clash Display'; font-weight: 600; font-size: 15px;
  color: var(--text);
}

.hero-bg-logo {
  position: absolute; left: 0; top: 0; bottom: 0; width: 50%;
  background-size: 240px; background-repeat: no-repeat; background-position: 70% center;
  opacity: 0.06; pointer-events: none; z-index: 0;
  filter: blur(1px) grayscale(0.3);
}
.hero-sub-scores {
  display: flex; gap: 22px; margin-top: 8px;
}
.hero-sub-score { display: flex; flex-direction: column; gap: 2px; }
.hero-sub-score-lbl {
  font-family: 'Oswald'; font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
}
.hero-sub-score-val {
  font-family: 'Clash Display'; font-weight: 600; font-size: 16px; color: var(--sub);
}
.fix-analysis {
  margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 6px;
}
.fix-analysis-tag {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 4px;
  font-family: 'Oswald'; font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .8px;
}
.fix-analysis-tag.hard    { background: rgba(239,83,80,.1);  border: 1px solid rgba(239,83,80,.3);  color: var(--fwd); }
.fix-analysis-tag.easy    { background: rgba(76,175,80,.1);  border: 1px solid rgba(76,175,80,.3);  color: var(--def); }
.fix-analysis-tag.neutral { background: rgba(255,255,255,.04); border: 1px solid var(--border); color: var(--sub); }
.fix-analysis-desc {
  font-family: 'DM Sans'; font-size: 11px; color: var(--muted); line-height: 1.55;
}
.ledger-chevron {
  margin-left: 8px; color: var(--muted); font-size: 10px;
  transition: transform .2s; display: inline-block;
}
.ledger.collapsed .ledger-chevron { transform: rotate(-90deg); }
.ledger.collapsed .ledger-grid { display: none; }
.ledger-head { cursor: pointer; user-select: none; }

.fac-pills {
  display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px;
}
.fac-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  font-family: 'Oswald'; font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .6px;
  background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08);
  color: var(--sub);
}
.fac-pill strong {
  font-family: 'Clash Display'; font-weight: 600; font-size: 12px;
  color: var(--text);
}
.fac-pill.boost { color: var(--def); border-color: rgba(76,175,80,.3); background: rgba(76,175,80,.06); }
.fac-pill.boost strong { color: var(--def); }
.fac-pill.nerf { color: var(--fwd); border-color: rgba(239,83,80,.3); background: rgba(239,83,80,.06); }
.fac-pill.nerf strong { color: var(--fwd); }

/* SECTIONS */
.section {
  padding: 22px 32px;
  border-bottom: 1px solid var(--border);
}
.sec-head {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
}
.sec-title {
  font-family: 'Barlow Condensed'; font-weight: 700; font-size: 14px;
  text-transform: uppercase; letter-spacing: 2px; color: var(--text);
}
.sec-div { flex: 1; height: 1px; background: var(--border); }
.sec-meta {
  font-family: 'Oswald'; font-size: 11px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
}

.comp-grid {
  display: flex; flex-direction: column;
}
.comp-row {
  display: grid; grid-template-columns: 1fr auto;
  align-items: baseline; gap: 10px;
  padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,.04);
}
.comp-row .lbl {
  font-family: 'Oswald'; font-weight: 500; font-size: 12px;
  color: var(--sub); text-transform: uppercase; letter-spacing: .5px;
}
.comp-row .val {
  font-family: 'Clash Display'; font-weight: 600; font-size: 17px;
  color: var(--text);
}
.comp-row .val.above { color: var(--def); }
.comp-row .val.below { color: var(--fwd); }

.prob-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
}
.prob-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px 18px;
  position: relative; overflow: hidden;
}
.prob-card-top {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 10px;
}
.prob-lbl {
  font-family: 'Oswald'; font-weight: 600; font-size: 11px;
  text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted);
}
.prob-num {
  font-family: 'Clash Display'; font-weight: 700; font-size: 32px;
  color: var(--text); line-height: 1;
}
.prob-num .pct { font-size: 18px; color: var(--muted); font-weight: 500; margin-left: 2px; }
.prob-liquid {
  height: 6px; background: rgba(255,255,255,.05);
  border-radius: 4px; overflow: hidden; position: relative;
}
.prob-liquid-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold), rgba(245,158,11,.3));
  border-radius: 4px;
  box-shadow: 0 0 12px rgba(245,158,11,.35);
  position: relative;
}
.prob-foot {
  font-family: 'DM Sans'; font-size: 11px; color: var(--muted);
  margin-top: 8px;
}

/* DATA LEDGER */
.ledger {
  background: var(--surf);
  padding: 22px 32px;
  border-top: 1px solid var(--border);
}
.ledger-head {
  display: flex; align-items: center; gap: 14px; margin-bottom: 14px;
}
.ledger-title {
  font-family: 'Barlow Condensed'; font-weight: 800; font-size: 14px;
  text-transform: uppercase; letter-spacing: 2px;
  display: flex; align-items: center; gap: 8px;
}
.ledger-title::before {
  content: ''; width: 6px; height: 16px; background: var(--gold);
  box-shadow: 0 0 10px rgba(245,158,11,.55); border-radius: 1px;
}
.ledger-src {
  font-family: 'Oswald'; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px;
  padding: 3px 10px; border-radius: 4px;
  background: rgba(76,175,80,.1); color: var(--green-lt);
  border: 1px solid rgba(76,175,80,.3);
}
.ledger-quality {
  font-family: 'Clash Display'; font-weight: 600; font-size: 13px;
  color: var(--def);
  display: flex; align-items: center; gap: 6px;
}
.ledger-quality::before {
  content: ''; width: 6px; height: 6px; background: var(--def);
  border-radius: 50%; box-shadow: 0 0 8px var(--def);
}
.ledger-quality.mid { color: var(--gold); }
.ledger-quality.mid::before { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.ledger-quality.lo { color: var(--fwd); }
.ledger-quality.lo::before { background: var(--fwd); box-shadow: 0 0 8px var(--fwd); }
.ledger-context {
  font-family: 'DM Sans'; font-size: 12px; color: var(--sub);
  margin-left: auto;
}
.ledger-context strong { color: var(--text); font-weight: 600; }

.ledger-grid {
  display: grid; grid-template-columns: 1.5fr 1fr; gap: 28px;
  align-items: start;
}
.ledger-tbl {
  width: 100%; border-collapse: collapse; font-size: 12px;
}
.ledger-tbl th {
  font-family: 'Oswald'; font-weight: 600; font-size: 9px;
  text-transform: uppercase; letter-spacing: 1.2px;
  color: var(--muted); text-align: right; padding: 6px 8px;
  border-bottom: 1px solid var(--border);
}
.ledger-tbl th:first-child { text-align: left; }
.ledger-tbl th.primary-col { color: var(--fire); }
.ledger-tbl td {
  font-family: 'Clash Display'; font-weight: 500; font-size: 13px;
  text-align: right; padding: 6px 8px;
  color: var(--sub);
  border-bottom: 1px solid rgba(255,255,255,.02);
}
.ledger-tbl td:first-child {
  text-align: left;
  font-family: 'Oswald'; font-weight: 500; font-size: 11px;
  text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
}
.ledger-tbl td.primary { color: var(--text); font-weight: 600; }
.ledger-tbl td.warn { color: var(--fwd); }
.ledger-tbl td.dash { color: rgba(255,255,255,.2); }

.ledger-island {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 18px 20px;
}
.ledger-island-head {
  font-family: 'Oswald'; font-weight: 600; font-size: 10px;
  text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted);
  margin-bottom: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.ledger-island-head strong { color: var(--gold); font-weight: 700; letter-spacing: 1.5px; }
.ledger-island .ledger-tbl td:first-child { color: var(--sub); }

.opp-title-team {
  display: flex; align-items: center; gap: 8px;
}
.opp-title-team img { width: 16px; height: 16px; object-fit: contain; }

.ledger-head-team {
  display: inline-flex; align-items: center; gap: 6px;
}
.ledger-head-team img { width: 13px; height: 13px; object-fit: contain; opacity: .9; }

.ledger-opp {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px;
}
.ledger-opp-title {
  font-family: 'Oswald'; font-weight: 600; font-size: 10px;
  text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted);
  margin-bottom: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.ledger-opp-title strong { color: var(--fire); font-weight: 700; letter-spacing: 1.5px; }
.ledger-opp-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.ledger-opp-stat {
  padding: 8px 0;
}
.ledger-opp-stat .k {
  font-family: 'Oswald'; font-size: 10px; font-weight: 500;
  text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
}
.ledger-opp-stat .v {
  font-family: 'Clash Display'; font-weight: 600; font-size: 20px;
  color: var(--text); margin-top: 2px;
}
.ledger-opp-stat .v small { font-size: 11px; color: var(--sub); font-weight: 500; }

.pen-badge {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 12px; padding: 6px 10px; border-radius: 6px;
  background: rgba(255,87,34,.08); border: 1px solid rgba(255,87,34,.3);
  font-family: 'Oswald'; font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 1px; color: var(--fire);
}

/* SCHEDULE */
.schedule {
  flex-shrink: 0;
  border-top: 1px solid var(--border);
  background: rgba(0,0,0,.2);
  padding: 12px 0 14px;
  max-height: 280px;
  overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.08) transparent;
}
.schedule::-webkit-scrollbar { width: 4px; }
.schedule::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 3px; }
.schedule-head {
  padding: 0 18px 8px;
  display: flex; align-items: baseline; gap: 8px;
}
.schedule-head h3 {
  font-family: 'Barlow Condensed', sans-serif; font-size: 13px;
  font-weight: 800; text-transform: uppercase; letter-spacing: 1.2px;
  color: var(--gold);
}
.schedule-head em {
  font-style: normal;
  font-family: 'Oswald'; font-size: 10px; font-weight: 500;
  color: var(--muted); text-transform: uppercase; letter-spacing: 1px;
}
.sched-item {
  padding: 7px 18px;
  display: grid; grid-template-columns: 1fr auto;
  gap: 6px; align-items: center;
  border-bottom: 1px solid rgba(255,255,255,.02);
  cursor: pointer;
  transition: background .12s;
}
.sched-item:hover { background: rgba(245,158,11,.03); }
.sched-item.active { background: rgba(255,87,34,.06); }
.sched-item:last-child { border-bottom: 0; }
.sched-date {
  grid-column: 1 / -1;
  font-family: 'Oswald'; font-size: 9px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
  margin-bottom: 2px;
}
.sched-date .time { color: var(--gold); }
.sched-teams {
  display: flex; align-items: center; gap: 7px;
  font-family: 'Barlow Condensed'; font-weight: 700; font-size: 12px;
  text-transform: uppercase; letter-spacing: .4px;
}
.sched-teams img { width: 14px; height: 14px; object-fit: contain; }
.sched-teams .vs {
  font-family: 'Oswald'; font-size: 9px; color: var(--muted);
  letter-spacing: 1px; margin: 0 2px;
}
.sched-stage {
  font-family: 'Oswald'; font-size: 9px; font-weight: 600;
  color: var(--fire); text-transform: uppercase; letter-spacing: 1px;
}

/* Spinner / loading */
.loading {
  display: flex; align-items: center; gap: 10px;
  padding: 24px 18px;
  font-family: 'Oswald'; font-size: 11px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
}
.spinner {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.08);
  border-top-color: var(--fire);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.list-empty, .err {
  padding: 24px 18px;
  font-family: 'Oswald'; font-size: 11px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
  text-align: center;
}
.err { color: var(--fwd); }
</style>
</head>
<body>
<div class="frame">

  <nav class="nav">
    <div class="nav-logo">
      <img src="/static/brand-logo.png" alt="PLM Fantasy League" style="height:40px;width:auto;object-fit:contain;"/>
    </div>
    <div class="nav-tabs">
      <a class="nav-tab" href="/dashboard#clasament">Clasament</a>
      <a class="nav-tab" href="/dashboard#scouting">Scouting</a>
      <a class="nav-tab" href="/dashboard#totw">TOTW</a>
      <a class="nav-tab active" href="/xpts">xPts Engine</a>
    </div>
    <div class="nav-filters">
      <div class="seg" id="segComp">
        <button class="active" data-comp="1">UCL</button>
        <button data-comp="2">WC 2026</button>
      </div>
      <div class="seg" id="segForm">
        <button class="active" data-form="season">Season</button>
        <button data-form="last5">Last 5</button>
      </div>
    </div>
  </nav>

  <div class="main">

    <aside class="list-pane">
      <div class="list-head">
        <h2>Rankings</h2>
        <span class="list-head-count" id="listCount">—</span>
      </div>
      <div class="list-filters" id="posFilters">
        <button class="pos-chip active" data-p="ALL">All</button>
        <button class="pos-chip" data-p="GK">GK</button>
        <button class="pos-chip" data-p="DEF">DEF</button>
        <button class="pos-chip" data-p="MID">MID</button>
        <button class="pos-chip" data-p="FWD">FWD</button>
      </div>
      <div class="list-search">
        <input id="searchInput" placeholder="Search player…" />
      </div>
      <div class="list" id="list">
        <div class="loading"><div class="spinner"></div> Loading predictions…</div>
      </div>
      <div class="schedule">
        <div class="schedule-head">
          <h3>Upcoming Fixtures</h3>
          <em id="scheduleStage">UCL</em>
        </div>
        <div id="schedule"></div>
      </div>
    </aside>

    <section class="canvas" id="canvas">
      <div class="canvas-empty">
        <div class="big">Select a player</div>
        <div class="small">Pick a name from the rankings to open the dossier.</div>
      </div>
    </section>

  </div>
</div>

<script>
const API = '/api/xg';

const state = {
  comp: 1,
  scoring: 'ucl',
  pos: null,
  form: 'season',
  fixtureId: null,
  search: '',
  data: [],
  dataLast5: [],
  fixtures: [],
  selectedId: null,
};

// ── API helpers ─────────────────────────────────────────────────
async function api(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(`API ${r.status}`);
  return r.json();
}
function logoUrl(id) {
  if (!id) return '';
  return `https://images.fotmob.com/image_resources/logo/teamlogo/${id}_xsmall.png`;
}
function logoImg(id, code, cls) {
  if (!id) return `<span class="li-fix-txt">${code || ''}</span>`;
  const safeCode = (code || '').replace(/"/g, '&quot;');
  return `<img class="${cls || ''}" src="${logoUrl(id)}" alt="${safeCode}" onerror="this.style.visibility='hidden'"/>`;
}
function fmtNum(v, dp = 2) {
  if (v === null || v === undefined) return '—';
  if (typeof v !== 'number') return v;
  return v.toFixed(dp);
}
function fmtInt(v) {
  if (v === null || v === undefined) return '—';
  return Math.round(v).toString();
}
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ── Data loading ────────────────────────────────────────────────
async function loadData() {
  const list = document.getElementById('list');
  list.innerHTML = '<div class="loading"><div class="spinner"></div> Loading predictions…</div>';

  try {
    const [rankings, rankingsLast5, fixtures] = await Promise.all([
      loadRankings(),
      loadRankingsLast5(),
      api(`/fixtures?competition_id=${state.comp}&status=scheduled`),
    ]);
    state.data = rankings || [];
    state.dataLast5 = rankingsLast5 || [];
    state.fixtures = fixtures || [];
    renderList();
    renderSchedule();
    if (!state.selectedId && state.data.length) {
      selectPlayer(state.data[0]);
    } else if (state.selectedId) {
      const found = state.data.find(p => p.player_id === state.selectedId);
      if (found) selectPlayer(found);
      else state.selectedId = null;
    }
  } catch (e) {
    list.innerHTML = `<div class="err">Could not load data<br>${escapeHtml(e.message)}</div>`;
  }
}

async function loadRankings() {
  const params = new URLSearchParams({
    competition_id: state.comp,
    scoring_system: state.scoring,
    limit: 200,
  });
  if (state.pos) params.set('position', state.pos);
  if (state.fixtureId) params.set('fixture_id', state.fixtureId);
  if (state.form) params.set('form_filter', state.form);
  return api('/rankings?' + params);
}

async function loadRankingsLast5() {
  const params = new URLSearchParams({
    competition_id: state.comp,
    scoring_system: state.scoring,
    limit: 200,
    form_filter: 'last5',
  });
  if (state.pos) params.set('position', state.pos);
  if (state.fixtureId) params.set('fixture_id', state.fixtureId);
  return api('/rankings?' + params);
}

// ── Render: list ────────────────────────────────────────────────
function renderList() {
  const el = document.getElementById('list');
  let items = [...state.data];

  if (state.search) {
    const q = state.search.toLowerCase();
    items = items.filter(p =>
      (p.player_name || '').toLowerCase().includes(q) ||
      (p.team_name || '').toLowerCase().includes(q)
    );
  }
  items.sort((a, b) => (b.xpts_adjusted || 0) - (a.xpts_adjusted || 0));

  document.getElementById('listCount').textContent = items.length ? `${items.length} players` : '—';

  if (!items.length) {
    el.innerHTML = '<div class="list-empty">No players match filter</div>';
    return;
  }

  el.innerHTML = items.map((p, i) => {
    const rank = i + 1;
    const pos = (p.position || '').toLowerCase();
    const isHome = p.home_team && p.team_name === p.home_team;
    const oppCode = isHome ? p.away_code : p.home_code;
    const oppId = isHome ? p.away_fotmob_id : p.home_fotmob_id;
    const vs = isHome ? 'vs' : '@';
    const active = state.selectedId === p.player_id ? 'active' : '';
    return `
      <div class="list-item ${active}" data-id="${p.player_id}">
        <div class="li-rank ${rank <= 3 ? 'top3' : ''}">${rank}</div>
        <div class="pos-badge ${pos}">${escapeHtml(p.position || '')}</div>
        ${logoImg(p.team_fotmob_id, p.team_code, 'li-logo')}
        <div class="li-body">
          <div class="li-name">${escapeHtml(p.player_name)}</div>
          <div class="li-fix">
            <span class="li-fix-txt">${escapeHtml(p.team_code || '')}</span>
            <span class="li-fix-txt">${vs}</span>
            ${oppId ? logoImg(oppId, oppCode, 'fx-logo') : ''}
            <span class="li-fix-txt">${escapeHtml(oppCode || '—')}</span>
          </div>
        </div>
        <div class="li-xpts">${(p.xpts_adjusted || 0).toFixed(2)}</div>
      </div>`;
  }).join('');

  el.querySelectorAll('.list-item').forEach(node => {
    node.addEventListener('click', () => {
      const id = parseInt(node.dataset.id, 10);
      const p = state.data.find(x => x.player_id === id);
      if (p) selectPlayer(p);
    });
  });
}

// ── Render: schedule ────────────────────────────────────────────
function renderSchedule() {
  const el = document.getElementById('schedule');
  const upcoming = state.fixtures.filter(f => f.status === 'scheduled');
  if (!upcoming.length) {
    el.innerHTML = '<div class="list-empty" style="padding:10px 18px;">No upcoming fixtures</div>';
    return;
  }
  el.innerHTML = upcoming.map(f => {
    const d = f.match_date ? new Date(f.match_date) : null;
    const dateStr = d ? d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) : '';
    const timeStr = d ? d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '';
    const stage = f.stage || f.round || '';
    const active = state.fixtureId === f.id ? 'active' : '';
    return `
      <div class="sched-item ${active}" data-id="${f.id}">
        <div class="sched-date">${escapeHtml(dateStr)}${timeStr ? ` <span class="time">· ${escapeHtml(timeStr)}</span>` : ''}</div>
        <div class="sched-teams">
          ${logoImg(f.home_fotmob_id, f.home_code, '')}
          <span>${escapeHtml(f.home_code || '')}</span>
          <span class="vs">vs</span>
          ${logoImg(f.away_fotmob_id, f.away_code, '')}
          <span>${escapeHtml(f.away_code || '')}</span>
        </div>
        <div class="sched-stage">${escapeHtml(stage)}</div>
      </div>`;
  }).join('');

  el.querySelectorAll('.sched-item').forEach(node => {
    node.addEventListener('click', () => {
      const id = parseInt(node.dataset.id, 10);
      state.fixtureId = state.fixtureId === id ? null : id;
      loadData();
    });
  });
}

// ── Render: canvas ──────────────────────────────────────────────
function selectPlayer(p) {
  state.selectedId = p.player_id;
  document.querySelectorAll('.list-item').forEach(n => {
    n.classList.toggle('active', parseInt(n.dataset.id, 10) === p.player_id);
  });
  renderCanvas(p);
  loadLedger(p);
}

function renderCanvas(p) {
  const pos = (p.position || '').toLowerCase();
  const isHome = p.home_team && p.team_name === p.home_team;
  const myTeam = p.team_name || '';
  const myTeamCode = p.team_code || '';
  const myTeamId = p.team_fotmob_id;
  const oppTeam = isHome ? (p.away_team || '') : (p.home_team || '');
  const oppCode = isHome ? p.away_code : p.home_code;
  const oppId = isHome ? p.away_fotmob_id : p.home_fotmob_id;

  const d = p.match_date ? new Date(p.match_date) : null;
  const fixDate = d
    ? d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) +
      ' · ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
    : '';

  const compLabel = state.comp === 1 ? 'UCL' : 'World Cup';
  const stageTxt = p.stage || (compLabel + (p.round ? ' · ' + p.round : ''));

  const xp = p.xpts_adjusted || 0;
  const raw = p.xpts_raw || 0;

  // Last 5 form score
  const last5Player = (state.dataLast5 || []).find(x => x.player_id === p.player_id);
  const xpLast5 = last5Player ? (last5Player.xpts_adjusted || 0) : null;

  // Components
  const compDefs = [
    { k: 'x_min_pts',          lbl: 'Minutes' },
    { k: 'x_goal_pts',         lbl: 'Goals' },
    { k: 'x_assist_pts',       lbl: 'Assists' },
    { k: 'x_cs_pts',           lbl: 'Clean Sheet' },
    { k: 'x_save_pts',         lbl: 'Saves' },
    { k: 'x_recovery_pts',     lbl: 'Recoveries' },
    { k: 'x_bonus_pts',        lbl: 'Bonus' },
    { k: 'x_pen_pts',          lbl: 'Penalty bonus' },
    { k: 'x_outside_box_pts',  lbl: 'Outside-box' },
    { k: 'x_gc_pts',           lbl: 'Goals conceded' },
    { k: 'x_disc_pts',         lbl: 'Discipline' },
  ];
  const comps = compDefs
    .map(c => ({ ...c, val: p[c.k] || 0 }))
    .filter(c => c.val !== 0)
    .sort((a, b) => Math.abs(b.val) - Math.abs(a.val));
  // Compute averages across all players for color coding
  const compAvgMap = {};
  compDefs.forEach(c => {
    const vals = state.data.map(pl => pl[c.k] || 0).filter(v => v !== 0);
    compAvgMap[c.k] = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
  });

  const compHtml = comps.map(c => {
    const avg = compAvgMap[c.k];
    const threshold = Math.max(0.05, Math.abs(avg) * 0.2);
    const cc = avg !== 0 ? (c.val > avg + threshold ? 'above' : c.val < avg - threshold ? 'below' : '') : '';
    return `
      <div class="comp-row">
        <span class="lbl">${c.lbl}</span>
        <span class="val ${cc}">${c.val > 0 ? '+' : ''}${c.val.toFixed(2)}</span>
      </div>`;
  }).join('') || '<div style="color:var(--muted);font-family:Oswald;font-size:11px;">No component breakdown yet.</div>';

  // Factors
  const compF = p.competition_factor || 1;
  const oppF = p.opponent_factor || 1;
  const factorPill = (k, v) => {
    const cls = v > 1.0001 ? 'boost' : v < 0.9999 ? 'nerf' : '';
    return `<span class="fac-pill ${cls}">${k} <strong>${v.toFixed(2)}×</strong></span>`;
  };

  // Probabilities
  const probs = [
    { lbl: 'Plays',       val: (p.prob_play || 0) * 100,  sub: 'Model-estimated appearance' },
    { lbl: '60+ minutes', val: (p.prob_60min || 0) * 100, sub: 'Full-match minute share' },
    { lbl: 'Clean sheet', val: (p.prob_cs || 0) * 100,    sub: 'Defensive projection' },
  ];
  const probHtml = probs.map(pr => `
    <div class="prob-card">
      <div class="prob-card-top"><span class="prob-lbl">${pr.lbl}</span></div>
      <div class="prob-num">${Math.round(pr.val)}<span class="pct">%</span></div>
      <div class="prob-liquid" style="margin-top:10px"><div class="prob-liquid-fill" style="width:${pr.val}%"></div></div>
      <div class="prob-foot">${pr.sub}</div>
    </div>
  `).join('');

  // Initial match context (updated with full opponent data in renderLedger)
  const initContext = isHome ? 'Acasă' : 'Deplasare';

  document.getElementById('canvas').innerHTML = `
    <div class="hero">
      <div class="hero-bg-logo" style="background-image:url('${logoUrl(myTeamId)}')"></div>
      <div class="hero-xpts">
        <div>
          <div class="hero-id">
            <div class="hero-pos ${pos}">${escapeHtml(p.position || '')}</div>
            <div class="hero-club">${escapeHtml(myTeam)}</div>
          </div>
          <div class="hero-name">${escapeHtml(p.player_name)}</div>
          <div class="hero-sub">${compLabel} · ${escapeHtml(myTeamCode || '')} ${isHome ? 'vs' : '@'} ${escapeHtml(oppCode || '—')}</div>
        </div>
        <div>
          <div class="hero-xpts-big">
            <div class="hero-xpts-n">${xp.toFixed(2)}</div>
            <div class="hero-xpts-lbl">xPts<br/>adj.</div>
          </div>
          <div class="hero-sub-scores">
            <div class="hero-sub-score">
              <span class="hero-sub-score-lbl">Raw</span>
              <span class="hero-sub-score-val">${raw.toFixed(2)}</span>
            </div>
            <div class="hero-sub-score">
              <span class="hero-sub-score-lbl">Last 5 adj.</span>
              <span class="hero-sub-score-val">${xpLast5 != null ? xpLast5.toFixed(2) : '—'}</span>
            </div>
          </div>
          <div class="fac-pills">
            ${factorPill('COMP', compF)}
            ${factorPill(`OPP (${escapeHtml(oppCode || '—')})`, oppF)}
          </div>
        </div>
      </div>
      <div class="fixture-card">
        <div class="fix-meta">
          <span class="stage">${escapeHtml(stageTxt)}</span>
          <span>${escapeHtml(fixDate)}</span>
        </div>
        <div class="fix-teams">
          <div class="fix-team">
            <div class="fix-crest ${isHome ? 'home' : 'away'}">${logoImg(myTeamId, myTeamCode, '')}</div>
            <div class="fix-teamname">${escapeHtml(myTeam)}</div>
            <div class="fix-role">${isHome ? 'Home' : 'Away'} · ${escapeHtml(p.player_name.split(' ').pop())}</div>
          </div>
          <div class="fix-vs">vs</div>
          <div class="fix-team">
            <div class="fix-crest ${isHome ? 'away' : 'home'}">${logoImg(oppId, oppCode, '')}</div>
            <div class="fix-teamname">${escapeHtml(oppTeam)}</div>
            <div class="fix-role">${isHome ? 'Away' : 'Home'}</div>
          </div>
        </div>
        <div class="fix-analysis" id="fixAnalysis">
          <div class="fix-analysis-tag neutral">${escapeHtml(initContext)}</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="sec-head">
        <div class="sec-title">Component breakdown</div>
        <div class="sec-div"></div>
        <div class="sec-meta">Adjusted total ${xp.toFixed(2)}</div>
      </div>
      <div class="comp-grid">${compHtml}</div>
    </div>

    <div class="section">
      <div class="sec-head">
        <div class="sec-title">Probability model</div>
        <div class="sec-div"></div>
        <div class="sec-meta">Baseline + form</div>
      </div>
      <div class="prob-grid">${probHtml}</div>
    </div>

    <div class="ledger collapsed" id="ledger">
      <div class="ledger-head">
        <div class="ledger-title">Data Ledger</div>
        <span class="ledger-src" id="ledgerSrc">loading…</span>
        <span class="ledger-quality" id="ledgerQuality">—</span>
        <div class="ledger-context">Fetching source provenance…</div>
        <span class="ledger-chevron">▼</span>
      </div>
      <div class="ledger-grid" id="ledgerGrid"></div>
    </div>
  `;

  // Wire ledger toggle
  document.querySelector('#ledger .ledger-head').addEventListener('click', () => {
    document.getElementById('ledger').classList.toggle('collapsed');
  });
}

async function loadLedger(p) {
  const grid = document.getElementById('ledgerGrid');
  if (!grid) return;

  try {
    const params = new URLSearchParams({
      scoring_system: state.scoring,
      form_filter: state.form,
    });
    if (p.fixture_id) params.set('fixture_id', p.fixture_id);
    const d = await api(`/players/${p.player_id}/breakdown?${params}`);
    renderLedger(d, p);
  } catch (e) {
    grid.innerHTML = `<div class="err" style="padding:10px 0;">Failed to load provenance: ${escapeHtml(e.message)}</div>`;
  }
}

function renderLedger(d, p) {
  const srcs = d.sources || {};
  const merged = srcs.merged || {};
  const q = d.data_quality;
  const qCls = q == null ? '' : q >= 0.75 ? '' : q >= 0.5 ? 'mid' : 'lo';
  const qTxt = q == null ? 'N/A' : q.toFixed(2);
  const primarySrc = (d.primary_source || 'none').toUpperCase();

  const isHome = p.home_team && p.team_name === p.home_team;
  const myTeam = p.team_name || '';
  const myTeamCode = p.team_code || '';
  const myTeamId = p.team_fotmob_id;
  const oppTeam = isHome ? (p.away_team || '') : (p.home_team || '');
  const oppCode = isHome ? p.away_code : p.home_code;
  const oppId = isHome ? p.away_fotmob_id : p.home_fotmob_id;

  const fields = [
    { k: 'matches',           lbl: 'Matches',     dp: 0 },
    { k: 'minutes',           lbl: 'Minutes',     dp: 0 },
    { k: 'goals',             lbl: 'Goals',       dp: 0 },
    { k: 'assists',           lbl: 'Assists',     dp: 0 },
    { k: 'xg',                lbl: 'xG',          dp: 2 },
    { k: 'npxg',              lbl: 'npxG',        dp: 2 },
    { k: 'xa',                lbl: 'xA',          dp: 2 },
    { k: 'shots',             lbl: 'Shots',       dp: 0 },
    { k: 'saves',             lbl: 'Saves',       dp: 0 },
    { k: 'recoveries',        lbl: 'Recoveries',  dp: 0 },
    { k: 'goals_outside_box', lbl: 'Outside-box G', dp: 0 },
    { k: 'yellow_cards',      lbl: 'YC',          dp: 0 },
  ];

  const cellVal = (src, f) => {
    const v = src ? src[f.k] : null;
    if (v === null || v === undefined) return '—';
    return f.dp === 0 ? fmtInt(v) : fmtNum(v, f.dp);
  };

  const warnCls = (v, base, key) => {
    if (v == null || base == null) return '';
    const a = v || 0, b = base || 0;
    if (a === 0 && b === 0) return '';
    const denom = Math.max(Math.abs(a), Math.abs(b));
    const delta = denom ? Math.abs(a - b) / denom : 0;
    const watched = ['matches', 'minutes', 'goals', 'xg', 'npxg', 'xa'].includes(key);
    return delta > 0.2 && watched ? 'warn' : '';
  };

  const rows = fields.map(f => {
    const fm  = srcs.fotmob  ? srcs.fotmob[f.k]  : null;
    const der = srcs.derived ? srcs.derived[f.k] : null;
    const mg  = merged ? merged[f.k] : null;
    const fmVal = cellVal(srcs.fotmob, f);
    const derVal = cellVal(srcs.derived, f);
    const mgVal  = cellVal(merged, f);
    return `
      <tr>
        <td>${f.lbl}</td>
        <td class="${fm == null ? 'dash' : warnCls(fm, mg, f.k)}">${fmVal}</td>
        <td class="${der == null ? 'dash' : ''}">${derVal}</td>
        <td class="primary ${mg == null ? 'dash' : ''}">${mgVal}</td>
      </tr>`;
  }).join('');

  const opp = d.opponent || {};
  const csPct = opp.cs_rate != null ? Math.round(opp.cs_rate * 100) : null;

  // Generate match analysis tags for hero fixture card
  const analysisEl = document.getElementById('fixAnalysis');
  if (analysisEl) {
    const tags = [];
    tags.push({ cls: 'neutral', txt: isHome ? 'Acasă' : 'Deplasare' });
    if (opp.cs_rate != null) {
      if (opp.cs_rate > 0.35)     tags.push({ cls: 'hard', txt: 'Defensivă solidă' });
      else if (opp.cs_rate < 0.2) tags.push({ cls: 'easy', txt: 'Defensivă slabă' });
    }
    if (opp.xga_per_match != null) {
      if (opp.xga_per_match < 0.9)  tags.push({ cls: 'hard', txt: 'Concede puțin' });
      else if (opp.xga_per_match > 1.5) tags.push({ cls: 'easy', txt: 'Concede mult' });
    }
    if (d.is_penalty_taker) tags.push({ cls: 'easy', txt: 'Penalty taker' });

    const tagHtml = tags.map(t => `<span class="fix-analysis-tag ${t.cls}">${t.txt}</span>`).join(' ');
    const descParts = [];
    if (opp.xga_per_match != null) descParts.push(`${escapeHtml(oppCode || 'Adv.')} concede ${opp.xga_per_match.toFixed(2)} xGA/meci`);
    if (csPct != null) descParts.push(`CS rate ${csPct}%`);

    analysisEl.innerHTML = `
      <div style="display:flex;gap:4px;flex-wrap:wrap;">${tagHtml}</div>
      ${descParts.length ? `<div class="fix-analysis-desc">${descParts.join(' · ')}</div>` : ''}
    `;
  }

  // Update ledger head
  const srcBadge = document.getElementById('ledgerSrc');
  const qBadge = document.getElementById('ledgerQuality');
  if (srcBadge) srcBadge.textContent = 'primary · ' + primarySrc;
  if (qBadge) {
    qBadge.textContent = 'quality ' + qTxt;
    qBadge.className = 'ledger-quality ' + qCls;
  }
  const ctx = document.querySelector('.ledger-context');
  if (ctx) ctx.innerHTML = `Cross-validated across <strong>FotMob</strong> · derived defensive overlay`;

  document.getElementById('ledgerGrid').innerHTML = `
    <div class="ledger-island">
      <div class="ledger-island-head">
        <span>Source comparison · <strong>${escapeHtml(myTeam)}</strong></span>
        <span class="ledger-head-team">${logoImg(myTeamId, myTeamCode, '')} ${escapeHtml(myTeamCode)}</span>
      </div>
      <table class="ledger-tbl">
        <thead><tr>
          <th>Stat</th><th>FM</th><th>DER</th><th class="primary-col">MRG</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="ledger-opp">
      <div class="ledger-opp-title">
        <span>Opponent</span>
        <span class="opp-title-team">${logoImg(oppId, oppCode, '')} <strong>${escapeHtml(oppTeam || oppCode || '—')}</strong></span>
      </div>
      <div class="ledger-opp-stats">
        <div class="ledger-opp-stat">
          <div class="k">xGA / match</div>
          <div class="v">${opp.xga_per_match != null ? opp.xga_per_match.toFixed(2) : '—'}</div>
        </div>
        <div class="ledger-opp-stat">
          <div class="k">CS rate</div>
          <div class="v">${csPct != null ? csPct : '—'}<small>%</small></div>
        </div>
        <div class="ledger-opp-stat">
          <div class="k">Matches</div>
          <div class="v">${fmtInt(opp.matches)}</div>
        </div>
        <div class="ledger-opp-stat">
          <div class="k">Clean sheets</div>
          <div class="v">${fmtInt(opp.clean_sheets)}</div>
        </div>
      </div>
      ${d.is_penalty_taker ? '<div class="pen-badge">◈ Primary penalty taker</div>' : ''}
    </div>
  `;
}

// ── Filter wiring ───────────────────────────────────────────────
document.getElementById('segComp').addEventListener('click', e => {
  const btn = e.target.closest('button[data-comp]');
  if (!btn) return;
  document.querySelectorAll('#segComp button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.comp = parseInt(btn.dataset.comp, 10);
  state.scoring = state.comp === 1 ? 'ucl' : 'worldcup';
  state.fixtureId = null;
  state.selectedId = null;
  document.getElementById('scheduleStage').textContent = state.comp === 1 ? 'UCL' : 'WC 2026';
  loadData();
});

document.getElementById('segForm').addEventListener('click', e => {
  const btn = e.target.closest('button[data-form]');
  if (!btn) return;
  document.querySelectorAll('#segForm button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.form = btn.dataset.form;
  loadData();
});

document.getElementById('posFilters').addEventListener('click', e => {
  const btn = e.target.closest('.pos-chip');
  if (!btn) return;
  document.querySelectorAll('.pos-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const p = btn.dataset.p;
  state.pos = p === 'ALL' ? null : p;
  loadData();
});

document.getElementById('searchInput').addEventListener('input', e => {
  state.search = e.target.value;
  renderList();
});

// ── Init ────────────────────────────────────────────────────────
loadData();
</script>
</body>
</html>
