<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PitchPulse — xPts Engine</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Barlow+Condensed:wght@400;600;700;800&family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0a0c14;
  --bg-outer: #060810;
  --surf: #0f1120;
  --card: #141828;
  --card2: #1a1f35;
  --border: rgba(0,240,255,.08);
  --border-lt: rgba(0,240,255,.04);
  --fire: #FF5722;
  --fire-dim: rgba(255,87,34,.15);
  --green: #2E7D32;
  --green-lt: #4CAF50;
  --neon: #00f0ff;
  --neon-dim: rgba(0,240,255,.15);
  --neon-pink: #ff2d78;
  --text: #e0eaff;
  --muted: #4a5580;
  --sub: #7a88b0;
  --gk: #FFB300;
  --def: #4CAF50;
  --mid: #42A5F5;
  --fwd: #EF5350;
  --r: 16px;
  --rsm: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg-outer);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding: 12px;
}
.app-frame {
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 50% 30% at 20% 0%, rgba(0,240,255,.03), transparent),
    radial-gradient(ellipse 40% 30% at 80% 100%, rgba(255,45,120,.02), transparent);
  border-radius: 20px;
  border: 1px solid var(--border);
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 0 80px rgba(0,0,0,.5), 0 0 40px rgba(0,240,255,.03), 0 0 0 1px rgba(0,240,255,.05);
}

body::before {
  content: '';
  position: fixed; inset: 0;
  opacity: .03;
  pointer-events: none;
  z-index: 9999;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 180px;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 3px; }

/* ─── NAVBAR ─── */
.navbar {
  height: 56px;
  background: var(--surf);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
  position: relative;
  z-index: 100;
  flex-shrink: 0;
  border-radius: 20px 20px 0 0;
}
.navbar::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  border-radius: 20px 20px 0 0;
  background: linear-gradient(90deg, transparent, var(--neon) 30%, rgba(0,240,255,.8) 50%, var(--neon) 70%, transparent);
}
.nav-logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .5px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 9px;
}
.nav-logo img { height: 40px; width: auto; object-fit: contain; }
.nav-tabs {
  display: flex;
  gap: 4px;
  margin-left: 32px;
}
.nav-tab {
  padding: 7px 18px;
  border-radius: 20px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--muted);
  cursor: pointer;
  border: 1px solid transparent;
  background: transparent;
  transition: color .2s, background .2s, border-color .2s;
  text-decoration: none;
}
.nav-tab:hover { color: var(--text); background: rgba(255,255,255,.04); }
.nav-tab.active {
  color: #fff;
  background: var(--fire);
  border-color: var(--fire);
  box-shadow: 0 2px 16px rgba(255,87,34,.35), 0 0 6px rgba(255,87,34,.2);
}
.nav-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav-icon-btn {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: color .2s, border-color .2s;
}
.nav-icon-btn:hover { color: var(--text); border-color: rgba(0,240,255,.18); }

/* ─── LAYOUT ─── */
.layout {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ─── LEFT PANEL — FILTERS ─── */
.left-panel {
  width: 280px;
  background: var(--surf);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.08) transparent;
}
.xp-header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
}
.xp-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 20px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.xp-title span { color: var(--fire); }
.xp-subtitle {
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
}

.xp-filter-section {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-lt);
}
.xp-filter-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--muted);
  margin-bottom: 10px;
}

/* Competition selector */
.xp-comp-tabs {
  display: flex;
  gap: 6px;
}
.xp-comp-tab {
  flex: 1;
  padding: 8px 6px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,.08);
  background: transparent;
  color: var(--muted);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
  cursor: pointer;
  text-align: center;
  transition: all .15s;
}
.xp-comp-tab:hover { color: var(--text); border-color: rgba(255,255,255,.15); }
.xp-comp-tab.active {
  background: var(--fire-dim);
  border-color: rgba(255,87,34,.4);
  color: var(--fire);
}

/* Position filters */
.xp-pos-row {
  display: flex;
  gap: 4px;
}
.xp-pos-btn {
  flex: 1;
  padding: 6px 4px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,.08);
  background: transparent;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
  cursor: pointer;
  text-align: center;
  transition: all .15s;
  color: var(--muted);
}
.xp-pos-btn:hover { color: var(--text); border-color: rgba(255,255,255,.15); }
.xp-pos-btn.active { border-width: 1.5px; }
.xp-pos-btn.active[data-pos="ALL"] { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.2); color: var(--text); }
.xp-pos-btn.active[data-pos="GK"]  { background: rgba(255,179,0,.12); border-color: rgba(255,179,0,.4); color: var(--gk); }
.xp-pos-btn.active[data-pos="DEF"] { background: rgba(76,175,80,.12); border-color: rgba(76,175,80,.4); color: var(--def); }
.xp-pos-btn.active[data-pos="MID"] { background: rgba(66,165,245,.12); border-color: rgba(66,165,245,.4); color: var(--mid); }
.xp-pos-btn.active[data-pos="FWD"] { background: rgba(239,83,80,.12); border-color: rgba(239,83,80,.4); color: var(--fwd); }

/* View mode toggle */
.xp-view-row {
  display: flex;
  gap: 3px;
  background: rgba(255,255,255,.04);
  border-radius: 10px;
  padding: 3px;
}
.xp-view-btn {
  flex: 1;
  padding: 7px 6px;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
  cursor: pointer;
  transition: all .15s;
}
.xp-view-btn:hover { color: var(--text); }
.xp-view-btn.active {
  background: var(--fire);
  color: #fff;
  box-shadow: 0 2px 10px rgba(255,87,34,.3);
}

/* Fixture selector */
.xp-fix-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.xp-fix-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all .15s;
}
.xp-fix-item:hover { background: rgba(255,255,255,.03); }
.xp-fix-item.active {
  background: rgba(0,240,255,.04);
  border-color: rgba(0,240,255,.15);
}
.xp-fix-teams {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.xp-fix-teams .vs { color: var(--muted); font-weight: 400; font-size: 10px; }
.xp-fix-codes {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .3px;
  color: var(--sub);
  margin-left: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.xp-fix-date {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--muted);
}
.xp-fix-status {
  font-size: 8px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
  padding: 2px 6px;
  border-radius: 4px;
}
.xp-fix-status.scheduled { background: rgba(66,165,245,.15); color: var(--mid); }
.xp-fix-status.finished { background: rgba(255,255,255,.05); color: var(--muted); }

/* Search */
.xp-search-wrap {
  position: relative;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
}
.xp-search {
  width: 100%;
  padding: 9px 12px 9px 34px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  outline: none;
  transition: border-color .2s;
}
.xp-search::placeholder { color: var(--muted); }
.xp-search:focus { border-color: rgba(0,240,255,.25); }
.xp-search-icon {
  position: absolute;
  left: 32px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}

/* Stats summary */
.xp-stats-bar {
  padding: 14px 20px;
  display: flex;
  gap: 16px;
  border-top: 1px solid var(--border);
  margin-top: auto;
}
.xp-stat-box {
  text-align: center;
  flex: 1;
}
.xp-stat-val {
  font-family: 'Clash Display', sans-serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--neon);
}
.xp-stat-lbl {
  font-size: 9px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-top: 2px;
}

/* ─── CENTER — RANKINGS TABLE ─── */
.center-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.xp-list-header {
  display: grid;
  grid-template-columns: 48px 1fr 92px 80px 76px 76px 76px;
  align-items: center;
  padding: 14px 28px;
  border-bottom: 1px solid var(--border);
  background: var(--surf);
  flex-shrink: 0;
}
.xp-list-header span {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--muted);
}
.xp-list-header span:nth-child(n+3) { text-align: center; }
.xp-list-header .col-sort {
  cursor: pointer;
  transition: color .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
}
.xp-list-header .col-sort:hover { color: var(--text); }
.xp-list-header .col-sort.active { color: var(--fire); }

.xp-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px 8px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.08) transparent;
}

.xp-row {
  display: grid;
  grid-template-columns: 48px 1fr 92px 80px 76px 76px 76px;
  align-items: center;
  padding: 14px 16px;
  border-radius: 12px;
  cursor: pointer;
  transition: background .15s;
  margin-bottom: 3px;
  border: 1px solid transparent;
}
.xp-row:hover { background: rgba(255,255,255,.03); }
.xp-row.selected {
  background: rgba(255,87,34,.04);
  border-color: rgba(255,87,34,.12);
}

.xp-rank {
  font-family: 'Clash Display', sans-serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--muted);
}
.xp-rank.r1 { color: #FFD700; text-shadow: 0 0 6px rgba(255,215,0,.4); }
.xp-rank.r2 { color: #C0C0C0; text-shadow: 0 0 5px rgba(192,192,192,.35); }
.xp-rank.r3 { color: #CD7F32; text-shadow: 0 0 5px rgba(205,127,50,.35); }

.xp-player-info { min-width: 0; padding-left: 6px; }
.xp-player-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
}
.xp-player-meta {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 4px;
}
.xp-player-fixture {
  font-size: 10px;
  color: var(--sub);
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-family: 'Barlow Condensed', sans-serif;
  letter-spacing: .3px;
}
.xp-player-fixture .at { color: var(--muted); }
.xp-pos-badge {
  font-size: 9px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 3px;
  letter-spacing: .3px;
}
.xp-pos-badge.GK  { background: rgba(255,179,0,.18); color: var(--gk); }
.xp-pos-badge.DEF { background: rgba(76,175,80,.18); color: var(--def); }
.xp-pos-badge.MID { background: rgba(66,165,245,.18); color: var(--mid); }
.xp-pos-badge.FWD { background: rgba(239,83,80,.18); color: var(--fwd); }
.xp-team-name {
  font-size: 11px;
  color: var(--sub);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.xp-team-logo {
  width: 18px;
  height: 18px;
  object-fit: contain;
  flex-shrink: 0;
}
.xp-fix-logo {
  width: 16px;
  height: 16px;
  object-fit: contain;
  flex-shrink: 0;
}

.xp-stat {
  text-align: center;
  font-family: 'Oswald', sans-serif;
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.1;
}
.xp-stat.primary {
  font-family: 'Clash Display', sans-serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--neon);
  text-shadow: 0 0 10px rgba(0,240,255,.25);
}
.xp-stat.fire {
  color: var(--fire);
  text-shadow: 0 0 6px rgba(255,87,34,.2);
}
.xp-stat.zero { color: var(--muted); font-size: 13px; }
.xp-stat-sub {
  font-family: 'DM Sans', sans-serif;
  font-size: 8px;
  color: var(--muted);
  margin-top: 2px;
}

/* ─── RIGHT — DETAIL DRAWER ─── */
.right-panel {
  width: 0;
  background: var(--surf);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  overflow-x: hidden;
  transition: width .3s cubic-bezier(.4,0,.2,1);
  flex-shrink: 0;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.08) transparent;
}
.right-panel.open { width: 380px; }

.xp-detail-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  position: relative;
}
.xp-detail-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: color .15s, border-color .15s;
  font-size: 14px;
}
.xp-detail-close:hover { color: var(--text); border-color: rgba(255,255,255,.15); }

.xp-detail-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .5px;
  padding-right: 36px;
}
.xp-detail-team {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}
.xp-detail-xpts {
  margin-top: 12px;
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.xp-detail-xpts-val {
  font-family: 'Clash Display', sans-serif;
  font-size: 36px;
  font-weight: 700;
  color: var(--neon);
  text-shadow: 0 0 16px rgba(0,240,255,.25);
}
.xp-detail-xpts-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--muted);
}
.xp-detail-raw {
  font-family: 'Oswald', sans-serif;
  font-size: 14px;
  color: var(--sub);
}

/* Component breakdown */
.xp-breakdown {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-lt);
}
.xp-breakdown-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--muted);
  margin-bottom: 12px;
}
.xp-bar-row {
  display: flex;
  align-items: center;
  margin-bottom: 8px;
}
.xp-bar-label {
  width: 80px;
  font-size: 11px;
  color: var(--sub);
  flex-shrink: 0;
}
.xp-bar-track {
  flex: 1;
  height: 6px;
  background: rgba(255,255,255,.04);
  border-radius: 3px;
  overflow: hidden;
  margin: 0 10px;
}
.xp-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width .4s ease-out;
}
.xp-bar-fill.goals    { background: linear-gradient(90deg, #EF5350, #ff7043); }
.xp-bar-fill.assists  { background: linear-gradient(90deg, #42A5F5, #64b5f6); }
.xp-bar-fill.cs       { background: linear-gradient(90deg, #4CAF50, #66bb6a); }
.xp-bar-fill.minutes  { background: linear-gradient(90deg, #7a88b0, #9fa8c7); }
.xp-bar-fill.saves    { background: linear-gradient(90deg, #FFB300, #ffc107); }
.xp-bar-fill.recovery { background: linear-gradient(90deg, #00f0ff, #4dd0e1); }
.xp-bar-fill.bonus    { background: linear-gradient(90deg, #ff2d78, #ff5c8d); }
.xp-bar-fill.disc     { background: linear-gradient(90deg, #ef5350, #e53935); }
.xp-bar-fill.pen      { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
.xp-bar-fill.ob       { background: linear-gradient(90deg, #ab47bc, #ce93d8); }
.xp-bar-fill.gc       { background: linear-gradient(90deg, #ef5350, #c62828); }
.xp-bar-val {
  width: 40px;
  text-align: right;
  font-family: 'Oswald', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  flex-shrink: 0;
}
.xp-bar-val.neg { color: #ef5350; }

/* Factors */
.xp-factors {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-lt);
}
.xp-factor-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
}
.xp-factor-label {
  font-size: 12px;
  color: var(--sub);
}
.xp-factor-val {
  font-family: 'Oswald', sans-serif;
  font-size: 14px;
  font-weight: 600;
}
.xp-factor-val.boost { color: var(--green-lt); }
.xp-factor-val.nerf { color: #ef5350; }
.xp-factor-val.neutral { color: var(--muted); }

/* Probabilities */
.xp-probs {
  padding: 16px 20px;
}
.xp-prob-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.xp-prob-ring {
  width: 36px;
  height: 36px;
  position: relative;
  flex-shrink: 0;
}
.xp-prob-ring svg { transform: rotate(-90deg); }
.xp-prob-pct {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Oswald', sans-serif;
  font-size: 10px;
  font-weight: 600;
  color: var(--text);
}
.xp-prob-label {
  font-size: 12px;
  color: var(--sub);
}

/* Provenance / validity view */
.xp-prov {
  padding: 16px 20px;
  border-top: 1px solid var(--border-lt);
}
.xp-prov-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.xp-prov-src-badge {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 4px;
  background: rgba(0,240,255,.08);
  color: var(--neon);
  border: 1px solid rgba(0,240,255,.2);
}
.xp-prov-quality {
  font-family: 'Oswald', sans-serif;
  font-size: 11px;
  color: var(--sub);
}
.xp-prov-quality.hi { color: var(--green-lt); }
.xp-prov-quality.mid { color: #ffb300; }
.xp-prov-quality.lo { color: #ef5350; }

.xp-prov-grid {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 4px 12px;
  font-size: 11px;
  margin-bottom: 12px;
}
.xp-prov-grid .lbl { color: var(--muted); }
.xp-prov-grid .val {
  font-family: 'Oswald', sans-serif;
  font-weight: 600;
  text-align: right;
  color: var(--text);
}
.xp-prov-grid .p90 {
  font-family: 'Oswald', sans-serif;
  font-size: 10px;
  color: var(--sub);
  text-align: right;
  min-width: 48px;
}
.xp-prov-grid .hdr {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  padding-top: 4px;
  border-top: 1px dashed var(--border-lt);
}

.xp-prov-opp {
  background: rgba(255,255,255,.02);
  border-radius: 6px;
  padding: 8px 10px;
  margin-bottom: 12px;
}
.xp-prov-opp-title {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.xp-prov-opp-row {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  padding: 2px 0;
}
.xp-prov-opp-row .l { color: var(--sub); }
.xp-prov-opp-row .v { font-family: 'Oswald', sans-serif; color: var(--text); }

.xp-prov-cmp {
  font-size: 10px;
}
.xp-prov-cmp-tbl {
  width: 100%;
  border-collapse: collapse;
  margin-top: 4px;
}
.xp-prov-cmp-tbl th {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9px;
  letter-spacing: .5px;
  color: var(--muted);
  text-align: right;
  padding: 4px 3px;
  font-weight: 700;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border-lt);
}
.xp-prov-cmp-tbl th:first-child { text-align: left; }
.xp-prov-cmp-tbl td {
  font-family: 'Oswald', sans-serif;
  font-size: 10px;
  padding: 3px;
  text-align: right;
  color: var(--sub);
}
.xp-prov-cmp-tbl td:first-child {
  text-align: left;
  color: var(--muted);
  font-family: inherit;
}
.xp-prov-cmp-tbl td.hl { color: var(--text); font-weight: 600; }
.xp-prov-cmp-tbl td.warn {
  color: #ef5350;
  position: relative;
}
.xp-prov-cmp-tbl td.warn::after {
  content: '!';
  font-size: 8px;
  background: #ef5350;
  color: #fff;
  border-radius: 50%;
  width: 10px;
  height: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-left: 3px;
  vertical-align: top;
}
.xp-prov-cmp-tbl tr.dash td { color: var(--muted); opacity: .5; }

/* ─── EMPTY / LOADING ─── */
.xp-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  flex: 1;
  color: var(--muted);
  padding: 40px;
}
.xp-empty-icon { font-size: 36px; opacity: .4; }
.xp-empty-text {
  font-size: 14px;
  text-align: center;
  max-width: 280px;
  line-height: 1.6;
}

.xp-loading {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  gap: 8px;
  color: var(--muted);
  font-size: 13px;
}
.xp-spinner {
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,.1);
  border-top-color: var(--neon);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.xp-row { animation: fadeSlideIn .35s ease-out both; }
</style>
</head>
<body>
<div class="app-frame">

<nav class="navbar">
  <div class="nav-logo">
    <img src="Brand Design/Logo PLM Fantasy_faraBG.png" alt="PLM Fantasy League"/>
  </div>
  <div class="nav-tabs">
    <a class="nav-tab" href="main-mockup.html">Clasament</a>
    <a class="nav-tab" href="main-mockup.html">Scouting</a>
    <a class="nav-tab" href="main-mockup.html">TOTW</a>
    <div class="nav-tab active">xPts</div>
  </div>
  <div class="nav-right">
    <div class="nav-icon-btn" id="refreshBtn" title="Refresh data" onclick="loadData()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </div>

</nav>

<div class="layout">

  <!-- LEFT — FILTERS -->
  <div class="left-panel">
    <div class="xp-header">
      <div class="xp-title">x<span>Pts</span> Engine</div>
      <div class="xp-subtitle">Expected Fantasy Points Calculator</div>
    </div>

    <div class="xp-search-wrap">
      <svg class="xp-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="xp-search" id="playerSearch" type="text" placeholder="Search player..."/>
    </div>

    <div class="xp-filter-section">
      <div class="xp-filter-label">Competition</div>
      <div class="xp-comp-tabs">
        <div class="xp-comp-tab active" data-comp="1" onclick="setComp(this)">UCL</div>
        <div class="xp-comp-tab" data-comp="2" onclick="setComp(this)">World Cup</div>
      </div>
    </div>

    <div class="xp-filter-section">
      <div class="xp-filter-label">Position</div>
      <div class="xp-pos-row">
        <div class="xp-pos-btn active" data-pos="ALL" onclick="setPos(this)">All</div>
        <div class="xp-pos-btn" data-pos="GK" onclick="setPos(this)">GK</div>
        <div class="xp-pos-btn" data-pos="DEF" onclick="setPos(this)">DEF</div>
        <div class="xp-pos-btn" data-pos="MID" onclick="setPos(this)">MID</div>
        <div class="xp-pos-btn" data-pos="FWD" onclick="setPos(this)">FWD</div>
      </div>

    <div class="xp-filter-section">
      <div class="xp-filter-label">View</div>
      <div class="xp-view-row">
        <div class="xp-view-btn active" data-view="next" onclick="setView(this)">Next Fixture</div>
        <div class="xp-view-btn" data-view="total" onclick="setView(this)">Total</div>

        <div class="xp-view-btn" data-form="last5" onclick="setForm(this)">Last 5</div>

    <div class="xp-filter-section" id="fixtureSection">

    <div class="xp-stats-bar" id="statsBar">
      <div class="xp-stat-box">
        <div class="xp-stat-val" id="statPlayers">-</div>
        <div class="xp-stat-lbl">Players</div>

      <div class="xp-stat-box">

      </div>
      <div class="xp-stat-box">

  </div>

  <!-- CENTER — RANKINGS LIST -->
  <div class="center-panel">
    <div class="xp-list-header">
      <span>#</span>
      <span>Player</span>
      <span class="col-sort active" data-sort="xpts_adjusted" onclick="setSort(this)">xPts <span>&#9660;</span></span>
      <span class="col-sort" data-sort="xpts_raw" onclick="setSort(this)">Raw</span>
      <span class="col-sort" data-sort="x_goal_pts" onclick="setSort(this)">Goals</span>
      <span class="col-sort" data-sort="x_assist_pts" onclick="setSort(this)">Asst</span>
      <span class="col-sort" data-sort="x_cs_pts" onclick="setSort(this)">CS</span>
    </div>
    <div class="xp-list" id="rankingsList">
      <div class="xp-loading"><div class="xp-spinner"></div> Loading predictions...</div>
    </div>
  </div>

  <!-- RIGHT — DETAIL DRAWER -->
  <div class="right-panel" id="detailPanel">
    <div id="detailContent"></div>

<script>
const API = '/api/xpts';
let state = {
  comp: 1,
  scoring: 'ucl',
  pos: null,
  view: 'next',
  form: 'season',
  sort: 'xpts_adjusted',
  sortDir: 1,
  search: '',
  fixtureId: null,
  selectedPlayer: null,
  data: [],
  fixtures: [],
};

// ── API helpers ─────────────────────────────────────────────────
async function api(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(`API ${r.status}`);
  return r.json();
}

function logoUrl(fotmobId) {
  if (!fotmobId) return '';
  return `https://images.fotmob.com/image_resources/logo/teamlogo/${fotmobId}_xsmall.png`;
}

function teamLogoHtml(fotmobId, code, cls = 'xp-team-logo') {
  if (!fotmobId) return `<span class="xp-team-name">${code || ''}</span>`;
  return `<img class="${cls}" src="${logoUrl(fotmobId)}" alt="${code || ''}" onerror="this.outerHTML='<span class=&quot;xp-team-name&quot;>${code || ''}</span>'">`;
}

// ── Data loading ────────────────────────────────────────────────
async function loadData() {
  const list = document.getElementById('rankingsList');
  list.innerHTML = '<div class="xp-loading"><div class="xp-spinner"></div> Loading predictions...</div>';

  try {
    const [rankings, fixtures] = await Promise.all([
      loadRankings(),
      api(`/fixtures?competition_id=${state.comp}&status=scheduled`),
    ]);
    state.data = rankings;
    state.fixtures = fixtures;
    renderFixtures();
    renderList();
    updateStats();
  } catch (e) {
    list.innerHTML = `<div class="xp-empty"><div class="xp-empty-icon">&#9888;</div><div class="xp-empty-text">Could not load data.<br><span style="font-size:11px;color:var(--muted)">${e.message}</span></div></div>`;
  }
}

async function loadRankings() {
  const params = new URLSearchParams({
    competition_id: state.comp,
    scoring_system: state.scoring,
    limit: 200,
  });
  if (state.pos) params.set('position', state.pos);
  if (state.view === 'total') params.set('aggregate', 'true');
  if (state.fixtureId && state.view !== 'total') params.set('fixture_id', state.fixtureId);
  if (state.form) params.set('form_filter', state.form);
  return api('/rankings?' + params);
}

// ── Render: Fixtures sidebar ────────────────────────────────────
function renderFixtures() {
  const el = document.getElementById('fixtureList');
  const upcoming = state.fixtures.filter(f => f.status === 'scheduled');
  if (!upcoming.length) {
    el.innerHTML = '<div style="font-size:12px;color:var(--muted);padding:8px 0;">No upcoming fixtures</div>';
    return;
  }
  el.innerHTML = upcoming.map(f => {
    const active = state.fixtureId === f.id ? 'active' : '';
    const date = f.match_date ? new Date(f.match_date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '';
    const homeLogo = teamLogoHtml(f.home_fotmob_id, f.home_code, 'xp-fix-logo');
    const awayLogo = teamLogoHtml(f.away_fotmob_id, f.away_code, 'xp-fix-logo');
    return `<div class="xp-fix-item ${active}" onclick="selectFixture(${f.id})">
      <div class="xp-fix-teams">${homeLogo}<span class="vs">vs</span>${awayLogo}<span class="xp-fix-codes">${f.home_code} &mdash; ${f.away_code}</span></div>
      <div class="xp-fix-date">${date}</div>
    </div>`;
  }).join('');
}

function selectFixture(id) {
  state.fixtureId = state.fixtureId === id ? null : id;
  loadData();
}

// ── Render: Rankings list ───────────────────────────────────────
function renderList() {
  const el = document.getElementById('rankingsList');
  let items = [...state.data];

  // Client-side search
  if (state.search) {
    const q = state.search.toLowerCase();
    items = items.filter(p => p.player_name.toLowerCase().includes(q) || (p.team_name||'').toLowerCase().includes(q));
  }

  // Client-side sort
  items.sort((a, b) => {
    const av = a[state.sort] || 0, bv = b[state.sort] || 0;
    return (bv - av) * state.sortDir;
  });

  if (!items.length) {
    el.innerHTML = '<div class="xp-empty"><div class="xp-empty-icon">&#128269;</div><div class="xp-empty-text">No players found with current filters</div></div>';
    return;
  }

  el.innerHTML = items.map((p, i) => {
    const rank = i + 1;
    const rankCls = rank === 1 ? 'r1' : rank === 2 ? 'r2' : rank === 3 ? 'r3' : '';
    const sel = state.selectedPlayer === p.player_id ? 'selected' : '';
    const xpts = (p.xpts_adjusted || 0).toFixed(2);
    const raw = (p.xpts_raw || 0).toFixed(2);
    const goals = fmtStat(p.x_goal_pts);
    const asst = fmtStat(p.x_assist_pts);
    const cs = fmtStat(p.x_cs_pts);
    const delay = Math.min(i * 20, 400);

    const logo = teamLogoHtml(p.team_fotmob_id, p.team_code);
    const isHome = p.home_team && p.team_name === p.home_team;
    const opp = isHome ? p.away_team : p.home_team;
    const oppCode = isHome ? p.away_code : p.home_code;
    const fixtureLine = opp ? `<div class="xp-player-fixture"><span class="at">${isHome ? 'vs' : '@'}</span> ${oppCode || opp}</div>` : '';

    return `<div class="xp-row ${sel}" onclick="selectPlayer(${JSON.stringify(p).replace(/"/g, '&quot;')})" style="animation-delay:${delay}ms">
      <div class="xp-rank ${rankCls}">${rank}</div>
      <div class="xp-player-info">
        <div class="xp-player-name">${p.player_name}</div>
        <div class="xp-player-meta">
          <span class="xp-pos-badge ${p.position}">${p.position}</span>
          ${logo}
          <span class="xp-team-name">${p.team_code || p.team_name || ''}</span>
        </div>
        ${fixtureLine}
      </div>
      <div class="xp-stat primary">${xpts}</div>
      <div class="xp-stat">${raw}</div>
      <div class="xp-stat ${parseFloat(goals) > 0 ? 'fire' : 'zero'}">${goals}</div>
      <div class="xp-stat ${parseFloat(asst) > 0 ? '' : 'zero'}">${asst}</div>
      <div class="xp-stat ${parseFloat(cs) > 0 ? '' : 'zero'}">${cs}</div>
    </div>`;
  }).join('');
}

function fmtStat(v) {
  if (!v || v === 0) return '0';
  return v.toFixed(2);
}

// ── Render: Detail drawer ───────────────────────────────────────
function selectPlayer(p) {
  state.selectedPlayer = p.player_id;
  const panel = document.getElementById('detailPanel');
  panel.classList.add('open');

  const maxXpts = Math.max(
    p.x_goal_pts||0, p.x_assist_pts||0, p.x_cs_pts||0,
    p.x_min_pts||0, p.x_save_pts||0, p.x_recovery_pts||0,
    p.x_bonus_pts||0, Math.abs(p.x_disc_pts||0), p.x_pen_pts||0,
    p.x_outside_box_pts||0, Math.abs(p.x_gc_pts||0), 0.01
  );

  const bars = [
    { label: 'Minutes',    val: p.x_min_pts,          cls: 'minutes' },
    { label: 'Goals',      val: p.x_goal_pts,         cls: 'goals' },
    { label: 'Assists',    val: p.x_assist_pts,       cls: 'assists' },
    { label: 'Clean Sheet',val: p.x_cs_pts,           cls: 'cs' },
    { label: 'Saves',      val: p.x_save_pts,         cls: 'saves' },
    { label: 'Recoveries', val: p.x_recovery_pts,     cls: 'recovery' },
    { label: 'Bonus',      val: p.x_bonus_pts,        cls: 'bonus' },
    { label: 'Penalties',  val: p.x_pen_pts,          cls: 'pen' },
    { label: 'Outside Box',val: p.x_outside_box_pts,  cls: 'ob' },
    { label: 'Goals Conc.', val: p.x_gc_pts,          cls: 'gc' },
    { label: 'Discipline', val: p.x_disc_pts,         cls: 'disc' },
  ].filter(b => b.val !== undefined);

  const compF = p.competition_factor || 1;
  const oppF = p.opponent_factor || 1;

  const fixture = p.home_team && p.away_team
    ? `${p.home_team} vs ${p.away_team}`
    : '';

  const teamLogo = teamLogoHtml(p.team_fotmob_id, p.team_code, 'xp-team-logo');

  document.getElementById('detailContent').innerHTML = `
    <div class="xp-detail-header">
      <div class="xp-detail-close" onclick="closeDetail()">&#10005;</div>
      <div class="xp-detail-name">${p.player_name}</div>
      <div class="xp-detail-team">
        <span class="xp-pos-badge ${p.position}" style="margin-right:6px">${p.position}</span>
        <span style="display:inline-flex;align-items:center;gap:6px;vertical-align:middle;">${teamLogo}${p.team_name || ''}</span>${fixture ? ' &mdash; ' + fixture : ''}
      </div>
      <div class="xp-detail-xpts">
        <div class="xp-detail-xpts-val">${(p.xpts_adjusted||0).toFixed(2)}</div>
        <div>
          <div class="xp-detail-xpts-label">xPts Adjusted</div>
          <div class="xp-detail-raw">Raw: ${(p.xpts_raw||0).toFixed(2)}</div>
        </div>
      </div>
    </div>

    <div class="xp-breakdown">
      <div class="xp-breakdown-title">Component Breakdown</div>
      ${bars.map(b => {
        const v = b.val || 0;
        const pct = Math.min(Math.abs(v) / maxXpts * 100, 100);
        const neg = v < 0;
        return `<div class="xp-bar-row">
          <div class="xp-bar-label">${b.label}</div>
          <div class="xp-bar-track"><div class="xp-bar-fill ${b.cls}" style="width:${pct}%"></div></div>
          <div class="xp-bar-val ${neg ? 'neg' : ''}">${v.toFixed(2)}</div>
        </div>`;
      }).join('')}
    </div>

    <div class="xp-factors">
      <div class="xp-breakdown-title">Adjustment Factors</div>
      <div class="xp-factor-row">
        <div class="xp-factor-label">Competition Factor</div>
        <div class="xp-factor-val ${compF > 1 ? 'boost' : compF < 1 ? 'nerf' : 'neutral'}">${compF.toFixed(3)}</div>
      </div>
      <div class="xp-factor-row">
        <div class="xp-factor-label">Opponent Factor</div>
        <div class="xp-factor-val ${oppF > 1 ? 'boost' : oppF < 1 ? 'nerf' : 'neutral'}">${oppF.toFixed(3)}</div>
      </div>
    </div>

    <div class="xp-probs">
      <div class="xp-breakdown-title">Probabilities</div>
      ${probRing('Plays', p.prob_play)}
      ${probRing('60+ min', p.prob_60min)}
      ${probRing('Clean Sheet', p.prob_cs)}
    </div>

    <div class="xp-prov" id="provBlock">
      <div class="xp-breakdown-title">Provenance · live validity</div>
      <div style="font-size:11px;color:var(--muted);">Loading inputs…</div>
    </div>
  `;

  // Re-render list to highlight selection
  renderList();

  // Fetch provenance for live validity checks
  loadProvenance(p);
}

function fmtNum(v, dp = 2) {
  if (v === null || v === undefined) return '—';
  if (typeof v !== 'number') return v;
  if (v === 0) return '0';
  return v.toFixed(dp);
}
function fmtInt(v) {
  if (v === null || v === undefined) return '—';
  return Math.round(v).toString();
}

async function loadProvenance(p) {
  const block = document.getElementById('provBlock');
  if (!block || !p.fixture_id) return;

  const form = state.form || 'season';
  const sys  = state.scoring || 'ucl';

  let d;
  try {
    d = await api(`/players/${p.player_id}/breakdown?fixture_id=${p.fixture_id}&scoring_system=${sys}&form_filter=${form}`);
  } catch (e) {
    block.innerHTML = `<div class="xp-breakdown-title">Provenance</div>
      <div style="font-size:11px;color:#ef5350;">Failed to load inputs: ${e.message}</div>`;
    return;
  }

  const s = d.season_stats || {};
  const p90 = d.per90 || {};
  const opp = d.opponent || {};
  const q = d.data_quality;
  const qCls = q === null || q === undefined ? '' : q >= 0.75 ? 'hi' : q >= 0.5 ? 'mid' : 'lo';
  const qTxt = q === null || q === undefined ? 'N/A' : q.toFixed(2);

  // Source comparison table — flags >20% disagreement on key fields
  const srcs = d.sources || {};
  const cmpFields = [
    { key: 'matches',  label: 'Matches',  dp: 0 },
    { key: 'minutes',  label: 'Minutes',  dp: 0 },
    { key: 'goals',    label: 'Goals',    dp: 0 },
    { key: 'assists',  label: 'Assists',  dp: 0 },
    { key: 'xg',       label: 'xG',       dp: 2 },
    { key: 'npxg',     label: 'npxG',     dp: 2 },
    { key: 'xa',       label: 'xA',       dp: 2 },
    { key: 'shots',    label: 'Shots',    dp: 0 },
    { key: 'saves',    label: 'Saves',    dp: 0 },
    { key: 'recoveries', label: 'Recov.', dp: 0 },
    { key: 'yellow_cards', label: 'YC',   dp: 0 },
  ];
  const orderedSrcs = ['fotmob', 'understat', 'derived', 'merged'].filter(k => srcs[k]);
  const shortSrc = { fotmob: 'FM', understat: 'UND', derived: 'DER', merged: 'MRG' };

  function cellCls(v, primary, key) {
    if (v === null || v === undefined) return 'dash';
    if (!primary) return '';
    const a = v || 0, b = primary || 0;
    if (a === 0 && b === 0) return '';
    const denom = Math.max(Math.abs(a), Math.abs(b));
    const delta = denom ? Math.abs(a - b) / denom : 0;
    if (delta > 0.2 && ['matches', 'minutes', 'goals', 'xg', 'npxg', 'xa'].includes(key)) return 'warn';
    return '';
  }

  const cmpRows = cmpFields.map(f => {
    const merged = srcs.merged ? srcs.merged[f.key] : null;
    const tds = orderedSrcs.map(src => {
      const v = srcs[src][f.key];
      let cls = src === 'merged' ? 'hl' : cellCls(v, merged, f.key);
      const txt = v === null || v === undefined ? '—' : (f.dp === 0 ? fmtInt(v) : fmtNum(v, f.dp));
      return `<td class="${cls}">${txt}</td>`;
    }).join('');
    return `<tr><td>${f.label}</td>${tds}</tr>`;
  }).join('');

  block.innerHTML = `
    <div class="xp-prov-hdr">
      <div class="xp-breakdown-title" style="margin:0">Input Stats · provenance</div>
      <div>
        <span class="xp-prov-src-badge">${d.primary_source || 'none'}</span>
        <span class="xp-prov-quality ${qCls}" style="margin-left:6px">quality ${qTxt}</span>
      </div>
    </div>

    <div class="xp-prov-grid">
      <div class="hdr" style="grid-column:1/-1">Season totals · Per90</div>
      <div class="lbl">Matches / Min / Starts</div>
      <div class="val">${fmtInt(s.matches)} / ${fmtInt(s.minutes)} / ${fmtInt(s.starts ?? s.matches)}</div>
      <div class="p90">—</div>

      <div class="lbl">Goals / Assists</div>
      <div class="val">${fmtInt(s.goals)} / ${fmtInt(s.assists)}</div>
      <div class="p90">—</div>

      <div class="lbl">xG · npxG · xA</div>
      <div class="val">${fmtNum(s.xg)} · ${fmtNum(s.npxg)} · ${fmtNum(s.xa)}</div>
      <div class="p90">npxG ${fmtNum(p90.npxg_per90)}</div>

      <div class="lbl">Shots · SoT</div>
      <div class="val">${fmtInt(s.shots)} · ${fmtInt(s.shots_on_target)}</div>
      <div class="p90">xA ${fmtNum(p90.xa_per90)}</div>

      <div class="lbl">Saves</div>
      <div class="val">${fmtInt(s.saves)}</div>
      <div class="p90">${fmtNum(p90.saves_per90)}/90</div>

      <div class="lbl">Recoveries</div>
      <div class="val">${fmtInt(s.recoveries)}</div>
      <div class="p90">${fmtNum(p90.recoveries_per90)}/90</div>

      <div class="lbl">Cards (Y / R)</div>
      <div class="val">${fmtInt(s.yellow_cards)} / ${fmtInt(s.red_cards)}</div>
      <div class="p90">YC ${fmtNum(p90.yellow_card_rate, 3)}</div>

      <div class="lbl">Outside-box goals / shots</div>
      <div class="val">${fmtInt(s.goals_outside_box)} / ${fmtInt(s.shots_outside_box)}</div>
      <div class="p90">${(p90.outside_box_goal_rate * 100 || 0).toFixed(1)}%</div>

      <div class="lbl">Penalty taker</div>
      <div class="val">${d.is_penalty_taker ? 'YES' : 'no'}</div>
      <div class="p90">—</div>
    </div>

    <div class="xp-prov-opp">
      <div class="xp-prov-opp-title">Opponent: ${opp.opponent_name || '—'}</div>
      <div class="xp-prov-opp-row"><span class="l">xGA / match</span>
        <span class="v">${fmtNum(opp.xga_per_match)}</span></div>
      <div class="xp-prov-opp-row"><span class="l">CS rate</span>
        <span class="v">${((opp.cs_rate || 0) * 100).toFixed(0)}%</span></div>
      <div class="xp-prov-opp-row"><span class="l">Matches · CS · GA</span>
        <span class="v">${fmtInt(opp.matches)} · ${fmtInt(opp.clean_sheets)} · ${fmtInt(opp.goals_against)}</span></div>
    </div>

    <div class="xp-prov-cmp">
      <div class="xp-breakdown-title" style="margin-bottom:4px">Source comparison · anomaly check</div>
      <table class="xp-prov-cmp-tbl">
        <thead><tr>
          <th>Field</th>
          ${orderedSrcs.map(s => `<th>${shortSrc[s]}</th>`).join('')}
        </tr></thead>
        <tbody>${cmpRows}</tbody>
      </table>
      <div style="font-size:9px;color:var(--muted);margin-top:6px;line-height:1.5;">
        <span style="color:#ef5350">!</span> = &gt;20% disagreement vs merged value. MRG column is the row used in the model.
      </div>
    </div>
  `;
}

function probRing(label, val) {
  const pct = Math.round((val || 0) * 100);
  const r = 14, c = 2 * Math.PI * r;
  const offset = c - (c * pct / 100);
  const color = pct > 70 ? 'var(--green-lt)' : pct > 40 ? 'var(--neon)' : 'var(--fire)';
  return `<div class="xp-prob-row">
    <div class="xp-prob-ring">
      <svg width="36" height="36" viewBox="0 0 36 36">
        <circle cx="18" cy="18" r="${r}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="3"/>
        <circle cx="18" cy="18" r="${r}" fill="none" stroke="${color}" stroke-width="3"
          stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
      </svg>
      <div class="xp-prob-pct">${pct}%</div>
    </div>
    <div class="xp-prob-label">${label}</div>
  </div>`;
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('open');
  state.selectedPlayer = null;
  renderList();
}

// ── Update stats bar ────────────────────────────────────────────
function updateStats() {
  document.getElementById('statPlayers').textContent = state.data.length;
  document.getElementById('statFixtures').textContent = state.fixtures.filter(f => f.status === 'scheduled').length;
  const avg = state.data.length
    ? (state.data.reduce((s, p) => s + (p.xpts_adjusted || 0), 0) / state.data.length).toFixed(2)
    : '-';
  document.getElementById('statAvgXpts').textContent = avg;
}

// ── Filter handlers ─────────────────────────────────────────────
function setComp(el) {
  document.querySelectorAll('.xp-comp-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  state.comp = parseInt(el.dataset.comp);
  state.scoring = state.comp === 1 ? 'ucl' : 'worldcup';
  state.fixtureId = null;
  loadData();
}

function setPos(el) {
  document.querySelectorAll('.xp-pos-btn').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  state.pos = el.dataset.pos === 'ALL' ? null : el.dataset.pos;
  loadData();
}

function setView(el) {
  el.parentElement.querySelectorAll('.xp-view-btn').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  state.view = el.dataset.view;
  const fixSection = document.getElementById('fixtureSection');
  fixSection.style.display = state.view === 'total' ? 'none' : '';
  loadData();
}

function setForm(el) {
  el.parentElement.querySelectorAll('.xp-view-btn').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  state.form = el.dataset.form;
  loadData();
}

function setSort(el) {
  const key = el.dataset.sort;
  if (state.sort === key) {
    state.sortDir *= -1;
  } else {
    state.sort = key;
    state.sortDir = 1;
  }
  document.querySelectorAll('.col-sort').forEach(s => {
    s.classList.toggle('active', s.dataset.sort === state.sort);
    const arrow = s.querySelector('span');
    if (arrow) arrow.remove();
  });
  const arrow = document.createElement('span');
  arrow.textContent = state.sortDir === 1 ? ' \u25BC' : ' \u25B2';
  el.appendChild(arrow);
  renderList();
}

// ── Search ──────────────────────────────────────────────────────
document.getElementById('playerSearch').addEventListener('input', e => {
  state.search = e.target.value;
  renderList();
});

// ── Init ────────────────────────────────────────────────────────
loadData();
</script>
</body>
</html>
